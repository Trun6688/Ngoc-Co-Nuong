<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tìm hiểu cô nương🌷</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: "Montserrat", sans-serif;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        180deg,
        #8bb8d8 0%,
        #e8c9a7 52%,
        #52783e 100%
    );
}

/* BẦU TRỜI */
.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

/* MÂY */
.cloud {
    position: absolute;
    width: 180px;
    height: 45px;

    border-radius: 50px;

    background: rgba(255,255,255,0.25);

    filter: blur(8px);

    animation: cloudMove 55s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;

    background: inherit;
    border-radius: 50%;
}

.cloud::before {
    width: 75px;
    height: 75px;

    left: 35px;
    bottom: 0;
}

.cloud::after {
    width: 55px;
    height: 55px;

    left: 90px;
    bottom: 0;
}

@keyframes cloudMove {

    from {
        transform: translateX(-250px);
    }

    to {
        transform: translateX(calc(100vw + 300px));
    }

}


/* CÁNH ĐỒNG */
.field {

    position: absolute;

    left: -5%;
    right: -5%;
    bottom: -12%;

    height: 48%;

    background:
        repeating-linear-gradient(
            8deg,
            rgba(45,82,35,0.75) 0 5px,
            rgba(84,122,57,0.72) 5px 12px
        );

    transform:
        perspective(350px)
        rotateX(12deg);
}


/* HOA TULIP */
.flower {

    position: absolute;

    bottom: -10px;

    font-size: 32px;

    animation:
        sway 3s ease-in-out infinite;

    transform-origin: bottom center;

    filter:
        drop-shadow(
            0 5px 4px rgba(0,0,0,0.18)
        );
}

@keyframes sway {

    0%, 100% {
        transform: rotate(-3deg);
    }

    50% {
        transform: rotate(3deg);
    }

}


/* KHUNG CHÍNH */
.card {

    position: relative;

    z-index: 10;

    width: min(88vw, 540px);

    padding: 44px 28px;

    text-align: center;

    border:
        1px solid
        rgba(255,255,255,0.4);

    border-radius: 30px;

    background:
        rgba(54,63,47,0.23);

    backdrop-filter: blur(9px);

    box-shadow:
        0 20px 70px
        rgba(35,50,25,0.28);
}


/* DÒNG NHỎ */
.small {

    font-size: 12px;

    letter-spacing: 4px;

    opacity: 0.82;

    margin-bottom: 18px;
}


/* CHỮ CHÍNH */
#text {

    min-height: 86px;

    font-family:
        "Cormorant Garamond",
        Georgia,
serif;

    font-size:
        clamp(34px, 9vw, 52px);

    font-weight: 500;

    line-height: 1.15;

    text-shadow:
        0 2px 15px
        rgba(0,0,0,0.28);
}


/* CON TRỎ */
.cursor {

    display: inline-block;

    width: 2px;

    height: 1em;

    background: white;

    margin-left: 4px;

    vertical-align: -3px;

    animation:
        blink 0.7s infinite;
}

@keyframes blink {

    50% {
        opacity: 0;
    }

}


/* NÚT */
button {

    margin-top: 26px;

    padding: 13px 26px;

    border:
        1px solid
        rgba(255,255,255,0.55);

    border-radius: 999px;

    background:
        rgba(255,255,255,0.16);

    color: white;

    font-family:
        "Montserrat",
        sans-serif;

    font-size: 14px;

    cursor: pointer;

    transition: 0.3s;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.12);
}

button:hover {

    background:
        rgba(255,255,255,0.28);

    transform:
        translateY(-3px);
}


/* CÂU HỎI */
#question {

    display: none;

    margin-top: 24px;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:
        clamp(25px, 6vw, 34px);

    line-height: 1.45;

    text-shadow:
        0 2px 12px
        rgba(0,0,0,0.25);
}


/* HOA / TIM BAY */
.heart {

    position: fixed;

    z-index: 20;

    pointer-events: none;

    animation:
        float 4s linear forwards;
}

@keyframes float {

    from {

        transform:
            translateY(0)
            scale(0.8);

        opacity: 0;
    }

    15% {

        opacity: 0.9;
    }

    to {

        transform:
            translateY(-110vh)
            scale(1.3);

        opacity: 0;
    }
}

</style>
</head>


<body>


<!-- BẦU TRỜI -->

<div
    class="sky"
    id="sky">
</div>


<!-- CÁNH ĐỒNG -->

<div class="field"></div>


<!-- KHUNG NỘI DUNG -->

<main class="card">

    <div class="small">

        TÌM HIỂU CÔ NƯƠNG

    </div>


    <div>

        <span id="text"></span>

        <span class="cursor"></span>

    </div>


    <button id="btn">

        Tớ mún hỏi cô nương là 🌷

    </button>


    <div id="question">

        🌷

        <strong>
            Hôm nay cô nương thế nào ?
        </strong>

        <br>

        🌷 Có bị deadline dí nhìu hong ?

    </div>

</main>



<script>


/* =========================
   TẠO MÂY
========================= */

const sky =
    document.getElementById("sky");


for (let i = 0; i < 5; i++) {

    const cloud =
        document.createElement("div");

    cloud.className =
        "cloud";

    cloud.style.top =
        (8 + Math.random() * 30) + "%";

    cloud.style.left =
        (Math.random() * 100) + "%";

    cloud.style.animationDelay =
        (-Math.random() * 40) + "s";

    sky.appendChild(cloud);
}



/* =========================
   TẠO HOA TULIP
========================= */

for (let i = 0; i < 75; i++) {

    const flower =
document.createElement("div");

    flower.className =
        "flower";

    flower.textContent =
        "🌷";

    flower.style.left =
        Math.random() * 100 + "%";

    flower.style.bottom =
        (Math.random() * 25 - 5) + "%";

    flower.style.fontSize =
        (18 + Math.random() * 28) + "px";

    flower.style.animationDuration =
        (2 + Math.random() * 2) + "s";

    flower.style.animationDelay =
        (-Math.random() * 3) + "s";

    flower.style.opacity =
        0.55 + Math.random() * 0.45;

    sky.appendChild(flower);
}



/* =========================
   HIỆU ỨNG GÕ CHỮ
========================= */

const phrase =
    "1.000.000 cái thơm má nè <3";

let index = 0;


function typeText() {

    if (index < phrase.length) {

        document.getElementById("text")
            .textContent += phrase[index];

        index++;

        setTimeout(
            typeText,
            85
        );
    }

}


typeText();



/* =========================
   NÚT BẤM
========================= */

document.getElementById("btn")
.onclick = () => {

    document.getElementById("question")
        .style.display = "block";


    document.getElementById("btn")
        .style.display = "none";


    /* Tạo hoa / tim bay */

    for (let j = 0; j < 12; j++) {

        setTimeout(() => {

            const heart =
                document.createElement("div");

            heart.className =
                "heart";


            heart.textContent =
                [
                    "🌷",
                    "🌷",
                    "🌷",
                    "🌷",
                    "🌷",
                    "♥",
                    "♥",
                    "♥"
                ][
                    Math.floor(
                        Math.random() * 4
                    )
                ];


            heart.style.left =
                (5 + Math.random() * 90) + "%";


            heart.style.bottom =
                "-20px";


            heart.style.fontSize =
                (14 + Math.random() * 20) + "px";


            document.body.appendChild(
                heart
            );


            setTimeout(() => {

                heart.remove();

            }, 4000);

        }, j * 170);

    }

};

</script>

</body>
</html>
