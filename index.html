<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gửi cô nương 🌙</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(
        circle at 50% 20%,
        #25264a 0%,
        #111225 42%,
        #05060d 100%
    );
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Bầu trời */
.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

/* Những ngôi sao */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: white;
    opacity: 0.65;
    animation: twinkle 2.5s infinite ease-in-out;
}

@keyframes twinkle {
    50% {
        opacity: 0.15;
        transform: scale(0.6);
    }
}

/* Mặt trăng */
.moon {
    position: absolute;
    top: 9%;
    right: 11%;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #fff8dc;
    box-shadow: 0 0 35px #fff4b8;
}

.moon::after {
    content: "";
    position: absolute;
    right: -7px;
    top: -5px;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #121326;
}

/* Khung chính */
.card {
    position: relative;
    width: min(88vw, 520px);
    padding: 42px 28px;
    text-align: center;

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 28px;

    background: rgba(10,11,28,0.58);
    backdrop-filter: blur(12px);

    box-shadow: 0 20px 70px rgba(0,0,0,0.4);
}

.small {
    font-size: 14px;
    letter-spacing: 3px;
    opacity: 0.65;
    margin-bottom: 18px;
}

/* Chữ */
#text {
    min-height: 78px;
    font-size: clamp(25px, 7vw, 38px);
    line-height: 1.35;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: white;
    margin-left: 4px;
    vertical-align: -2px;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

/* Nút */
button {
    margin-top: 28px;
    padding: 12px 25px;

    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;

    background: rgba(255,255,255,0.08);
    color: white;

    font-size: 16px;
    cursor: pointer;

    transition: 0.3s;
}

button:hover {
    background: rgba(255,255,255,0.16);
    transform: translateY(-2px);
}

/* Câu hỏi */
#question {
    display: none;
    margin-top: 25px;
    font-size: 20px;
    line-height: 1.6;
}

/* Tim / ký tự bay */
.heart {
    position: fixed;
    pointer-events: none;
    animation: float 4s linear forwards;
}

@keyframes float {
    from {
        transform: translateY(0) scale(0.8);
        opacity: 0;
    }

    15% {
        opacity: 0.9;
    }

    to {
        transform: translateY(-110vh) scale(1.3);
        opacity: 0;
    }
}
</style>
</head>
<body>
  <div class="sky" id="sky"></div>

<div class="moon"></div>

<main class="card">

    <div class="small">
        MỘT CÂU HỎI NHỎ
    </div>

    <div>
        <span id="text"></span>
        <span class="cursor"></span>
    </div>

    <button id="btn">
        Có một điều muốn hỏi cô nương ✨
    </button>

    <div id="question">
        🌙 <strong>Hôm nay cô nương thế nào?</strong>
        <br>
        Có chuyện gì vui thì kể tớ nghe với nhé.
    </div>

</main>

<script>

/* =========================
   TẠO SAO
========================= */

const sky = document.getElementById("sky");

for (let i = 0; i < 90; i++) {

    const star = document.createElement("span");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    star.style.opacity =
        0.25 + Math.random() * 0.75;

    sky.appendChild(star);
}


/* =========================
   HIỆU ỨNG GÕ CHỮ
========================= */

const phrase =
    "Gửi cô nương một câu hỏi...";

let index = 0;

function typeText() {

    if (index < phrase.length) {

        document.getElementById("text")
            .textContent += phrase[index];

        index++;

        setTimeout(typeText, 85);
    }
}

typeText();


/* =========================
   NÚT BẤM
========================= */

document.getElementById("btn").onclick = () => {

    document.getElementById("question")
        .style.display = "block";

    document.getElementById("btn")
        .style.display = "none";


    /* Tạo hiệu ứng bay */

    for (let j = 0; j < 10; j++) {

        setTimeout(() => {

            const heart =
                document.createElement("div");

            heart.className = "heart";

            heart.textContent =
                ["♡", "✦", "♥"]
                [Math.floor(Math.random() * 3)];

            heart.style.left =
                (10 + Math.random() * 80) + "%";

            heart.style.bottom = "-20px";

            heart.style.fontSize =
                (14 + Math.random() * 18) + "px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);

        }, j * 180);
    }

};

</script>

</body>
</html>
